version: "3.5"

name:
  kafka-cluster

services:
  kafka-0:
    container_name: kafka-0
    hostname: kafka-0
    image: apache/kafka:latest
    ports:
      - "29092:29092"
      - "29095:9404"
    restart: always
    networks:
      - kafka
    environment:
      # KAFKA CLUSTER
      - KAFKA_NODE_ID=0
      - KAFKA_CLUSTER_ID=abcdefghijklmnopqrstuv
      - CLUSTER_ID=abcdefghijklmnopqrstuv
      - KAFKA_PROCESS_ROLES=broker,controller
      - KAFKA_CONTROLLER_QUORUM_VOTERS=0@kafka-0:9093,1@kafka-1:9093,2@kafka-2:9093
      - KAFKA_SUPER_USERS=User:sa
      # LISTENERS
      - KAFKA_LISTENERS=INTERNAL://:9091,EXTERNAL://:29092,CONTROLLER://:9093
      - KAFKA_ADVERTISED_LISTENERS=INTERNAL://:9091,EXTERNAL://localhost:29092
      - ALLOW_PLAINTEXT_LISTENER=yes
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=INTERNAL:SASL_PLAINTEXT,EXTERNAL:SASL_PLAINTEXT,CONTROLLER:SASL_PLAINTEXT
      # BROKER SETTINGS
      - KAFKA_INTER_BROKER_LISTENER_NAME=INTERNAL
      - KAFKA_INTER_BROKER_USER=sa
      - KAFKA_INTER_BROKER_PASSWORD=000000
      - KAFKA_SASL_MECHANISM_INTER_BROKER_PROTOCOL=PLAIN
      - KAFKA_LISTENER_NAME_INTERNAL_PLAIN_SASL_JAAS_CONFIG=org.apache.kafka.common.security.plain.PlainLoginModule required username="sa" password="000000" user_sa="000000";
      - KAFKA_LISTENER_NAME_EXTERNAL_PLAIN_SASL_JAAS_CONFIG=org.apache.kafka.common.security.plain.PlainLoginModule required username="sa" password="000000" user_sa="000000";
      # CONTROLLER SETTINGS
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_SASL_MECHANISM_CONTROLLER_PROTOCOL=PLAIN
      - KAFKA_CONTROLLER_USER=sa
      - KAFKA_CONTROLLER_PASSWORD=000000
      - KAFKA_LISTENER_NAME_CONTROLLER_PLAIN_SASL_JAAS_CONFIG=org.apache.kafka.common.security.plain.PlainLoginModule required username="sa" password="000000" user_sa="000000";
      # CLIENT SETTINGS
      - KAFKA_CLIENT_LISTENER_NAME=EXTERNAL
      - KAFKA_CLIENT_USERS=sa,da,va
      - KAFKA_CLIENT_PASSWORDS=000000,111111,222222
      # ACL
#      - KAFKA_AUTHORIZER_CLASS_NAME=org.apache.kafka.metadata.authorizer.StandardAuthorizer
#      - KAFKA_ALLOW_EVERYONE_IF_NO_ACL_FOUND=false
      # SSL
#      - KAFKA_SSL_ENDPOINT_IDENTIFICATION_ALGORITHM=
#      - KAFKA_CERTIFICATE_PASSWORD=supersecret
#      - KAFKA_TLS_TYPE=JKS
      # SASL
      - KAFKA_SASL_ENABLED_MECHANISMS=PLAIN
      # COMMON SETTINGS
      - KAFKA_AUTO_CREATE_TOPICS_ENABLE=false
    volumes:
      - kafka_0_data:/var/lib/kafka/data
#      - ./keystore/kafka-0.server.keystore.jks:/opt/bitnami/kafka/config/certs/kafka.keystore.jks:ro
#      - ./truststore/kafka.truststore.jks:/opt/bitnami/kafka/config/certs/kafka.truststore.jks:ro
    healthcheck:
      test: "bash -c 'printf \"\" > /dev/tcp/127.0.0.1/9091; exit $$?;'"
      interval: 5s
      timeout: 10s
      retries: 3
      start_period: 30s

  kafka-1:
    container_name: kafka-1
    hostname: kafka-1
    image: apache/kafka:latest
    ports:
      - "29093:29093"
      - "29096:9404"
    restart: always
    networks:
      - kafka
    environment:
      # KAFKA CLUSTER
      - KAFKA_NODE_ID=1
      - KAFKA_CLUSTER_ID=abcdefghijklmnopqrstuv
      - CLUSTER_ID=abcdefghijklmnopqrstuv
      - KAFKA_PROCESS_ROLES=broker,controller
      - KAFKA_CONTROLLER_QUORUM_VOTERS=0@kafka-0:9093,1@kafka-1:9093,2@kafka-2:9093
      - KAFKA_SUPER_USERS=User:sa
      # LISTENERS
      - KAFKA_LISTENERS=INTERNAL://:9091,EXTERNAL://:29093,CONTROLLER://:9093
      - KAFKA_ADVERTISED_LISTENERS=INTERNAL://kafka-1:9091,EXTERNAL://localhost:29093
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=INTERNAL:SASL_PLAINTEXT,EXTERNAL:SASL_PLAINTEXT,CONTROLLER:SASL_PLAINTEXT
      - ALLOW_PLAINTEXT_LISTENER=yes
      # BROKER SETTINGS
      - KAFKA_INTER_BROKER_LISTENER_NAME=INTERNAL
      - KAFKA_INTER_BROKER_USER=sa
      - KAFKA_INTER_BROKER_PASSWORD=000000
      - KAFKA_SASL_MECHANISM_INTER_BROKER_PROTOCOL=PLAIN
      - KAFKA_LISTENER_NAME_INTERNAL_PLAIN_SASL_JAAS_CONFIG=org.apache.kafka.common.security.plain.PlainLoginModule required username="sa" password="000000" user_sa="000000";
      - KAFKA_LISTENER_NAME_EXTERNAL_PLAIN_SASL_JAAS_CONFIG=org.apache.kafka.common.security.plain.PlainLoginModule required username="sa" password="000000" user_sa="000000";
      # CONTROLLER SETTINGS
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_SASL_MECHANISM_CONTROLLER_PROTOCOL=PLAIN
      - KAFKA_CONTROLLER_USER=sa
      - KAFKA_CONTROLLER_PASSWORD=000000
      - KAFKA_LISTENER_NAME_CONTROLLER_PLAIN_SASL_JAAS_CONFIG=org.apache.kafka.common.security.plain.PlainLoginModule required username="sa" password="000000" user_sa="000000";
      # CLIENT SETTINGS
      - KAFKA_CLIENT_LISTENER_NAME=EXTERNAL
      - KAFKA_CLIENT_USERS=sa,da,va
      - KAFKA_CLIENT_PASSWORDS=000000,111111,222222
      # ACL
#      - KAFKA_AUTHORIZER_CLASS_NAME=org.apache.kafka.metadata.authorizer.StandardAuthorizer
#      - KAFKA_ALLOW_EVERYONE_IF_NO_ACL_FOUND=false
      # SSL
#      - KAFKA_SSL_ENDPOINT_IDENTIFICATION_ALGORITHM=
#      - KAFKA_CERTIFICATE_PASSWORD=supersecret
#      - KAFKA_TLS_TYPE=JKS
#      # SASL
      - KAFKA_SASL_ENABLED_MECHANISMS=PLAIN
      # COMMON SETTINGS
      - KAFKA_AUTO_CREATE_TOPICS_ENABLE=false
    volumes:
      - kafka_1_data:/var/lib/kafka/data
#      - ./keystore/kafka-1.server.keystore.jks:/opt/bitnami/kafka/config/certs/kafka.keystore.jks:ro
#      - ./truststore/kafka.truststore.jks:/opt/bitnami/kafka/config/certs/kafka.truststore.jks:ro
    healthcheck:
      test: "bash -c 'printf \"\" > /dev/tcp/127.0.0.1/9091; exit $$?;'"
      interval: 5s
      timeout: 10s
      retries: 3
      start_period: 30s

  kafka-2:
    container_name: kafka-2
    hostname: kafka-2
    image: apache/kafka:latest
    ports:
      - "29094:29094"
      - "29097:9404"
    restart: always
    networks:
      - kafka
    environment:
      # KAFKA CLUSTER
      - KAFKA_NODE_ID=2
      - KAFKA_CLUSTER_ID=abcdefghijklmnopqrstuv
      - CLUSTER_ID=abcdefghijklmnopqrstuv
      - KAFKA_PROCESS_ROLES=broker,controller
      - KAFKA_CONTROLLER_QUORUM_VOTERS=0@kafka-0:9093,1@kafka-1:9093,2@kafka-2:9093
      - KAFKA_SUPER_USERS=User:sa
      # LISTENERS
      - KAFKA_LISTENERS=INTERNAL://:9091,EXTERNAL://:29094,CONTROLLER://:9093
      - KAFKA_ADVERTISED_LISTENERS=INTERNAL://:9091,EXTERNAL://localhost:29094
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=INTERNAL:SASL_PLAINTEXT,EXTERNAL:SASL_PLAINTEXT,CONTROLLER:SASL_PLAINTEXT
      - ALLOW_PLAINTEXT_LISTENER=yes
      # BROKER SETTINGS
      - KAFKA_INTER_BROKER_LISTENER_NAME=INTERNAL
      - KAFKA_INTER_BROKER_USER=sa
      - KAFKA_INTER_BROKER_PASSWORD=000000
      - KAFKA_SASL_MECHANISM_INTER_BROKER_PROTOCOL=PLAIN
      - KAFKA_LISTENER_NAME_INTERNAL_PLAIN_SASL_JAAS_CONFIG=org.apache.kafka.common.security.plain.PlainLoginModule required username="sa" password="000000" user_sa="000000";
      - KAFKA_LISTENER_NAME_EXTERNAL_PLAIN_SASL_JAAS_CONFIG=org.apache.kafka.common.security.plain.PlainLoginModule required username="sa" password="000000" user_sa="000000";
      # CONTROLLER SETTINGS
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_SASL_MECHANISM_CONTROLLER_PROTOCOL=PLAIN
      - KAFKA_CONTROLLER_USER=sa
      - KAFKA_CONTROLLER_PASSWORD=000000
      - KAFKA_LISTENER_NAME_CONTROLLER_PLAIN_SASL_JAAS_CONFIG=org.apache.kafka.common.security.plain.PlainLoginModule required username="sa" password="000000" user_sa="000000";
      # CLIENT SETTINGS
      - KAFKA_CLIENT_LISTENER_NAME=EXTERNAL
      - KAFKA_CLIENT_USERS=sa,da,va
      - KAFKA_CLIENT_PASSWORDS=000000,111111,222222
      # ACL
#      - KAFKA_AUTHORIZER_CLASS_NAME=org.apache.kafka.metadata.authorizer.StandardAuthorizer
#      - KAFKA_ALLOW_EVERYONE_IF_NO_ACL_FOUND=false
      # SSL
#      - KAFKA_SSL_ENDPOINT_IDENTIFICATION_ALGORITHM=
#      - KAFKA_CERTIFICATE_PASSWORD=supersecret
#      - KAFKA_TLS_TYPE=JKS
#      # SASL
      - KAFKA_SASL_ENABLED_MECHANISMS=PLAIN
      # COMMON SETTINGS
      - KAFKA_AUTO_CREATE_TOPICS_ENABLE=false
    volumes:
      - kafka_2_data:/var/lib/kafka/data
#      - ./keystore/kafka-2.server.keystore.jks:/opt/bitnami/kafka/config/certs/kafka.keystore.jks:ro
#      - ./truststore/kafka.truststore.jks:/opt/bitnami/kafka/config/certs/kafka.truststore.jks:ro
    healthcheck:
      test: "bash -c 'printf \"\" > /dev/tcp/127.0.0.1/9091; exit $$?;'"
      interval: 5s
      timeout: 10s
      retries: 3
      start_period: 30s

  kafka-ui:
    container_name: kafka-ui
    image: provectuslabs/kafka-ui:v0.7.2
    ports:
      - 8080:8080
    restart: always
    networks:
      - kafka
    environment:
      # CLUSTER SETTINGS
      - KAFKA_CLUSTERS_0_NAME=dev-cluster
      - KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS=kafka-0:9091,kafka-1:9091,kafka-2:9091
      - KAFKA_CLUSTERS_0_PROPERTIES_SECURITY_PROTOCOL=SASL_PLAINTEXT
      - KAFKA_CLUSTERS_0_PROPERTIES_SASL_MECHANISM=PLAIN
      - KAFKA_CLUSTERS_0_PROPERTIES_PROTOCOL=SASL
      - KAFKA_CLUSTERS_0_PROPERTIES_SASL_JAAS_CONFIG=org.apache.kafka.common.security.plain.PlainLoginModule required username="sa" password="000000";
      - DYNAMIC_CONFIG_ENABLED=true
      # AUTH
      - AUTH_TYPE=LOGIN_FORM
      - SPRING_SECURITY_USER_NAME=admin
      - SPRING_SECURITY_USER_PASSWORD=admin
      # TLS
#      - KAFKA_CLUSTERS_0_SSL_TRUSTSTORELOCATION=/kafka.truststore.jks
#      - KAFKA_CLUSTERS_0_SSL_TRUSTSTOREPASSWORD=supersecret
#    volumes:
#      - ./truststore/kafka.truststore.jks:/kafka.truststore.jks:ro
      # - ./keystore/kafka-0.server.keystore.jks:/kafka.keystore.jks:ro
    depends_on:
      - kafka-0
      - kafka-1
      - kafka-2
    healthcheck:
      test: wget --no-verbose --tries=1 --spider localhost:8080 || exit 1
      interval: 5s
      timeout: 10s
      retries: 3
      start_period: 30s


volumes:
  kafka_0_data:
  kafka_1_data:
  kafka_2_data:

networks:
  kafka: